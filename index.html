<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DemoView 项目入口</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        color: #182033;
        background: #f5f7fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      main {
        width: min(960px, calc(100% - 40px));
        margin: 0 auto;
        padding: 56px 0;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 30px;
        line-height: 1.25;
      }

      .intro {
        margin: 0 0 28px;
        color: #667085;
        font-size: 15px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        gap: 16px;
      }

      .project {
        display: block;
        min-height: 154px;
        padding: 22px;
        border: 1px solid #e5eaf3;
        border-radius: 8px;
        background: #fff;
        color: inherit;
        text-decoration: none;
        box-shadow: 0 8px 24px rgba(31, 41, 55, 0.06);
      }

      .project:hover {
        border-color: #1769ff;
        box-shadow: 0 12px 30px rgba(23, 105, 255, 0.12);
      }

      .project strong {
        display: block;
        margin-bottom: 10px;
        font-size: 18px;
      }

      .project span {
        display: block;
        color: #667085;
        line-height: 1.7;
      }

      .path {
        margin-top: 18px;
        color: #1769ff;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>DemoView 项目入口</h1>
      <p class="intro">请选择要查看的原型项目。每个项目都部署在独立目录下，互不影响。</p>

      <section class="grid" aria-label="项目列表">
        <a class="project" href="./transfer_approval/">
          <strong>费用转账申请审批</strong>
          <span>原仓库已有的财务转账审批 HTML 可点击原型。</span>
          <span class="path">/transfer_approval/</span>
        </a>

        <a class="project" href="./edit_action_demo/">
          <strong>集体研学活动</strong>
          <span>本次新增的集体研学活动列表、创建、编辑与需求说明原型。</span>
          <span class="path">/edit_action_demo/</span>
        </a>
      </section>
    </main>
  </body>
</html>
