<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DemoView 项目入口</title>
    <style>
      body { margin: 0; min-height: 100vh; font-family: "PingFang SC", "Microsoft YaHei", Arial, sans-serif; background: #f5f7fb; color: #182033; }
      main { width: min(960px, calc(100% - 40px)); margin: 0 auto; padding: 56px 0; }
      h1 { margin: 0 0 10px; font-size: 30px; }
      p { margin: 0 0 28px; color: #667085; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
      .project { display: block; min-height: 128px; padding: 22px; border: 1px solid #e5eaf3; border-radius: 8px; background: #fff; color: inherit; text-decoration: none; box-shadow: 0 8px 24px rgba(31, 41, 55, .06); }
      .project:hover { border-color: #1769ff; box-shadow: 0 12px 30px rgba(23, 105, 255, .12); }
      .project strong { display: block; margin-bottom: 14px; font-size: 18px; }
      .project span { color: #1769ff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
    </style>
  </head>
  <body>
    <main>
      <h1>DemoView 项目入口</h1>
      <p>请选择要查看的原型项目。每个项目都部署在独立目录下，互不影响。</p>
      <section class="grid" aria-label="项目列表">
        <a class="project" href="./bid_prototype/"><strong>Bid Prototype</strong><span>/bid_prototype/</span></a>
        <a class="project" href="./bid_upload_required/"><strong>Bid Upload Required</strong><span>/bid_upload_required/</span></a>
        <a class="project" href="./edit_action_demo/"><strong>Edit Action Demo</strong><span>/edit_action_demo/</span></a>
        <a class="project" href="./transfer_approval/"><strong>Transfer Approval</strong><span>/transfer_approval/</span></a>
      </section>
    </main>
  </body>
</html>
