<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>集体研学活动列表</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="school-thumb"></div>
        <strong>吴哥研学机构（市级）</strong>
        <button class="plain-top-button" type="button">机构</button>
      </div>
      <nav class="topnav" aria-label="主导航">
        <a class="active" href="#">研学</a>
        <a href="#">课后服务</a>
      </nav>
      <div class="top-actions">
        <span class="badge">99+</span>
        <button class="top-icon" type="button" aria-label="消息">♧</button>
        <button class="top-icon" type="button" aria-label="全屏">⛶</button>
        <div class="avatar">杨</div>
      </div>
    </header>

    <aside class="sidebar">
      <button class="nav-item" type="button"><span>⌂</span>数据看板</button>
      <button class="nav-item" type="button"><span>◇</span>研学课程</button>
      <button class="nav-item" type="button"><span>▧</span>托管活动管理</button>
      <button class="nav-item" type="button"><span>◁</span>社会实践</button>
      <button class="nav-item" type="button"><span>●</span>场地管理</button>
      <button class="nav-item active" type="button"><span>⚑</span>集体研学活动</button>
      <button class="nav-item" type="button"><span>▤</span>任务广场</button>
      <button class="nav-item" type="button"><span>⌜</span>比选中心</button>
      <button class="nav-item" type="button"><span>▣</span>出行管理</button>
      <button class="nav-item" type="button"><span>▥</span>报表管理(研学)</button>
      <button class="nav-item" type="button"><span>◴</span>订单管理（研学）</button>
      <button class="nav-item" type="button"><span>Ⓡ</span>财务管理（研学）</button>
      <button class="nav-item" type="button"><span>▤</span>托管活动结算</button>
      <button class="nav-item" type="button"><span>●</span>集体研学活动结算</button>
      <button class="nav-item" type="button"><span>⚙</span>系统设置</button>
      <button class="collapse" type="button">≪</button>
    </aside>

    <main class="workspace">
      <div class="breadcrumb">⌂ / <strong>集体研学活动</strong></div>

      <section class="filter-card">
        <div class="filter-grid">
          <label class="field">
            <span>适用年级</span>
            <select>
              <option>请选择</option>
              <option>一年级</option>
              <option>二年级</option>
              <option>三年级</option>
            </select>
          </label>
          <label class="field date-field">
            <span>活动出行日期</span>
            <input value="" placeholder="开始日期">
            <em>→</em>
            <input value="" placeholder="结束日期">
          </label>
          <label class="field">
            <span>所属教育局</span>
            <select>
              <option>请选择</option>
              <option>吴哥-测试教育局（市级）</option>
            </select>
          </label>
          <label class="field">
            <span>学校名称</span>
            <select>
              <option>请选择</option>
              <option>吴哥测试小学1（市级）</option>
            </select>
          </label>
          <label class="field">
            <span>报名类型</span>
            <select>
              <option>请选择</option>
              <option>需要报名</option>
              <option>无需报名</option>
            </select>
          </label>
          <label class="field">
            <span>状态</span>
            <select>
              <option>请选择</option>
              <option>未提交</option>
              <option>已通过</option>
            </select>
          </label>
        </div>
        <div class="filter-side">
          <button class="primary-button" type="button">⌕ 查询</button>
          <button class="link-filter" type="button">展开⌄</button>
        </div>
      </section>

      <section class="insurance-banner">
        <strong>教育保险服务系统</strong>
        <span>点击进入投保</span>
        <p>请服务机构及时为被服务学生购买保险，做好安全保障工作。</p>
      </section>

      <section class="table-card">
        <div class="table-actions">
          <a class="primary-button" href="./form.html?mode=create">创建申报活动</a>
        </div>
        <div class="table-scroll">
          <table class="activity-table">
            <thead>
              <tr>
                <th>活动名称</th>
                <th>海报二维码</th>
                <th>适用年级</th>
                <th>价格(元)</th>
                <th>活动出行日期</th>
                <th>报名类型</th>
                <th>申报学校</th>
                <th>所属教育局</th>
                <th>上/下架</th>
                <th>状态</th>
                <th>审核时间</th>
                <th>操作</th>
              </tr>
            </thead>
            <tbody id="activityRows"></tbody>
          </table>
        </div>
        <div class="pagination">
          <span>共 76 条数据</span>
          <button class="page active" type="button">1</button>
          <button class="page" type="button">2</button>
          <button class="page" type="button">3</button>
          <button class="page" type="button">4</button>
          <button class="page" type="button">5</button>
          <span>...</span>
          <button class="page" type="button">8</button>
          <button class="page" type="button">〉</button>
          <select aria-label="每页条数">
            <option>10 条/页</option>
            <option>20 条/页</option>
          </select>
          <span>跳至</span>
          <input class="page-jump" aria-label="页码">
          <span>页</span>
        </div>
      </section>
    </main>
  </div>

  <div class="side-code">机构小程序码《</div>
  <script src="./app.js?v=20260520"></script>
</body>
</html>
