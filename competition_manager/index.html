<script>
var clients = {
  'center-base': {
    name: '中心基地',
    menu: [
      {id:'event-manage', label:'赛事管理', icon:'🏆', badge:'1', children:[
        {id:'event-list', label:'赛事列表'},
        {id:'review-scoring', label:'评审打分'}
      ]}
    ]
  },
  'education-bureau': {
    name: '教育局',
    menu: [
      {id:'event-manage', label:'赛事管理', icon:'🏆', children:[
        {id:'event-list', label:'赛事列表'},
        {id:'review-scoring', label:'评审打分'}
      ]}
    ]
  },
  'school': {
    name: '学校',
    menu: [
      {id:'event-manage', label:'赛事管理', icon:'🏆', badge:'2', children:[
        {id:'event-list', label:'赛事列表'},
        {id:'review-scoring', label:'评审打分'}
      ]}
    ]
  },
  'organization': {
    name: '机构',
    menu: [
      {id:'review-scoring', label:'评审打分', icon:'📝'}
    ]
  }
};

var currentClient = 'center-base';
var currentPage = 'event-list';

function switchClient(clientId) {
  currentClient = clientId;
  
  document.querySelectorAll('.switch-panel button').forEach(function(btn) {
    btn.classList.remove('active');
  });
  event.target.classList.add('active');

  if (clientId === 'student') {
    document.getElementById('web-app').style.display = 'none';
    document.getElementById('student-app').classList.add('active');
    renderStudentContent('activity');
  } else {
    document.getElementById('web-app').style.display = 'flex';
    document.getElementById('student-app').classList.remove('active');
    currentPage = (clientId === 'organization') ? 'review-scoring' : 'event-list';
    renderSidebar();
    renderContent();
  }
}

function renderSidebar() {
  var menu = clients[currentClient].menu;
  var html = '';
  
  menu.forEach(function(item) {
    var isActive = item.id === 'event-manage';
    html += '<div class="menu-item' + (isActive ? ' active' : '') + '" onclick="toggleMenu(this)">';
    html += '<span class="icon">' + item.icon + '</span>';
    html += '<span>' + item.label + '</span>';
    if (item.badge) {
      html += '<span class="badge">' + item.badge + '</span>';
    }
    html += '</div>';

    if (item.children) {
      html += '<div class="sub-menu">';
      item.children.forEach(function(child) {
        var isChildActive = child.id === currentPage;
        html += '<div class="sub-menu-item' + (isChildActive ? ' active' : '') + '" onclick="loadPage(\'' + child.id + '\', \'' + child.label + '\')">';
        html += '<span>' + child.label + '</span>';
        html += '</div>';
      });
      html += '</div>';
    }
  });

  document.getElementById('menu').innerHTML = html;
}

function toggleMenu(el) {
  el.classList.toggle('active');
}

function loadPage(pageId, pageLabel) {
  currentPage = pageId;
  renderSidebar();
  renderContent();
}

function renderContent() {
  var content = document.getElementById('content-area');
  switch(currentPage) {
    case 'event-list': content.innerHTML = renderEventList(); break;
    case 'create-event': content.innerHTML = renderCreateEvent(); break;
    case 'review-scoring': content.innerHTML = renderReviewScoring(); break;
    case 'event-detail': content.innerHTML = renderEventDetailPage(); break;
    default: content.innerHTML = renderDefault();
  }
}

function renderEventList() {
  if (!window.indexEventRecords) {
    window.indexEventRecords = [
      {id:1,name:'赛事比赛活动（乒乓球活动）',date:'2026-05-01 至 2026-07-31',status:'投稿中',statusClass:'status-submitting',works:0,online:true,ownerType:'center-base',ownerLabel:'中心基地'},
      {id:2,name:'校园科技节创意大赛',date:'2026-06-15 至 2026-08-30',status:'未开始',statusClass:'status-ended',works:0,online:false,ownerType:'school',ownerLabel:'隆昌一小'},
      {id:3,name:'书法绘画比赛',date:'2026-04-01 至 2026-06-15',status:'已结束',statusClass:'status-approved',works:156,online:true,ownerType:'center-base',ownerLabel:'中心基地'}
    ];
  }
  var createBtn = (currentClient === 'education-bureau' || currentClient === 'organization') ? '' : '<button class="btn btn-primary" onclick="loadPage(\'create-event\', \'创建赛事\')">+ 创建赛事</button>';
  var rows = window.indexEventRecords.map(function(event, index) {
    return '<tr><td>' + (index + 1) + '</td><td>' + event.name + '</td><td>' + event.ownerLabel + '</td><td>' + event.date + '</td><td><span class="status-tag ' + event.statusClass + '">' + event.status + '</span></td><td>' + event.works + '</td><td><span class="status-tag ' + (event.online ? 'status-approved' : 'status-ended') + '">' + (event.online ? '已上架' : '已下架') + '</span></td><td class="action-links">' + renderIndexEventActions(event) + '</td></tr>';
  }).join('');
  return '<div class="breadcrumb"><a href="#">首页</a><span>›</span><span>赛事管理</span></div>' +
    '<div class="card">' +
    '<div class="card-header"><div class="title">赛事列表</div>' + createBtn + '</div>' +
    '<div class="card-body"><div class="search-bar">' +
    '<div class="search-group"><label>名称</label><input type="text" placeholder="请输入赛事名称进行查找"></div>' +
    '<div class="search-group"><label>起止日期</label><input type="date"><span style="margin:0 8px;">至</span><input type="date"></div>' +
    '<div class="search-group"><label>状态</label><select><option>请选择状态</option><option>未开始</option><option>投稿中</option><option>评选中</option><option>已结束</option></select></div>' +
    '<button class="btn btn-secondary">重置</button><button class="btn btn-primary">查询</button></div>' +
    '<div class="table-wrapper"><table><thead><tr><th>序号</th><th>赛事名称</th><th>创建来源</th><th>起止日期</th><th>赛事状态</th><th>参赛作品数</th><th>上架状态</th><th>操作</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>' +
    '<div class="pagination"><div class="info">共 ' + window.indexEventRecords.length + ' 条数据</div><div class="controls"><button disabled>上一页</button><button class="active">1</button><button disabled>下一页</button></div></div></div>';
}

function renderIndexEventActions(event) {
  if (currentClient === 'education-bureau') return '<a href="#" onclick="openEventDetailPage();return false;">查看</a>';
  var actions = '<a href="#" onclick="openEventDetailPage();return false;">查看</a>';
  if (event.ownerType !== currentClient) {
    return actions + '<span style="color:#c0c4cc;margin-right:12px;cursor:not-allowed;">非本端创建，不可管理</span>';
  }
  if (event.online) {
    actions += '<a href="#" onclick="toggleIndexEventOnline(' + event.id + ', false);return false;">下架</a><span style="color:#c0c4cc;margin-right:12px;cursor:not-allowed;">编辑</span><span style="color:#c0c4cc;margin-right:12px;cursor:not-allowed;">删除</span>';
  } else {
    actions += '<a href="#" onclick="toggleIndexEventOnline(' + event.id + ', true);return false;">上架</a><a href="#" onclick="openIndexEditEvent(' + event.id + ');return false;">编辑</a><a href="#" onclick="deleteIndexEvent(' + event.id + ');return false;">删除</a>';
  }
  return actions;
}

function toggleIndexEventOnline(id, online) {
  var event = window.indexEventRecords.find(function(item) { return item.id === id; });
  if (!event) return;
  if (event.ownerType !== currentClient) {
    alert('该赛事非本端创建，不能进行上下架管理');
    return;
  }
  event.online = online;
  alert(online ? '赛事已上架，上线状态下不可编辑和删除' : '赛事已下架，可进行编辑或删除');
  renderContent();
}

function openIndexEditEvent(id) {
  var event = window.indexEventRecords.find(function(item) { return item.id === id; });
  if (!event || event.ownerType !== currentClient) {
    alert('该赛事非本端创建，不能编辑');
    return;
  }
  if (event.online) {
    alert('上线状态下不可编辑，请先下架赛事');
    return;
  }
  alert('进入编辑赛事：' + event.name + '（模拟编辑页）');
}

function deleteIndexEvent(id) {
  var event = window.indexEventRecords.find(function(item) { return item.id === id; });
  if (!event || event.ownerType !== currentClient) {
    alert('该赛事非本端创建，不能删除');
    return;
  }
  if (event.online) {
    alert('上线状态下不可删除，请先下架赛事');
    return;
  }
  if (confirm('确认删除该赛事吗？')) {
    window.indexEventRecords = window.indexEventRecords.filter(function(item) { return item.id !== id; });
    alert('赛事已删除');
    renderContent();
  }
}

function renderCreateEvent() {
  return '<div class="breadcrumb"><a href="#">首页</a><span>›</span><a href="#" onclick="loadPage(\'event-list\',\'赛事列表\')">赛事管理</a><span>›</span><span>创建赛事</span></div>' +
    '<div class="card">' +
    '<div class="card-header"><div class="title">创建赛事</div><button class="btn btn-secondary" onclick="loadPage(\'event-list\',\'赛事列表\')">返回</button></div>' +
    '<div class="card-body">' +
    '<div class="step-indicator">' +
    '<div class="step active" data-step="1"><span class="step-num">1</span><span class="step-label">基本信息</span></div>' +
    '<div class="step-line"></div>' +
    '<div class="step" data-step="2"><span class="step-num">2</span><span class="step-label">时间与轮次</span></div>' +
    '<div class="step-line"></div>' +
    '<div class="step" data-step="3"><span class="step-num">3</span><span class="step-label">评分与奖项</span></div>' +
    '</div>' +
    '<div id="step-1" class="step-content">' +
    '<div class="form-group"><label>赛事名称 *</label><input type="text" placeholder="请输入赛事名称（2-50字）"></div>' +

function openScoreModal(id, readonly) {
  var modal = document.getElementById('modal-overlay');
  var modalBox = document.getElementById('modal-box');
  var title = document.getElementById('modal-title');
  var body = document.getElementById('modal-body');
  var footer = document.getElementById('modal-footer');
  var isSecond = id === 2;
  modalBox.classList.add('modal-lg');
  title.textContent = readonly ? '查看评分' : '去评分';
  body.innerHTML = '<div style="background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:12px;"><div style="font-weight:700;margin-bottom:6px;">' + (isSecond ? '科技小发明-智能垃圾桶' : '我的乒乓球之旅') + '</div><div style="font-size:13px;color:#64748b;line-height:1.7;">学生信息：' + (isSecond ? '李四 / 隆昌一中 / 初二(3)班' : '张三 / 隆昌一小 / 六年级(1)班') + '</div></div>' +
    (readonly ? '<div style="color:#b45309;background:#fef3c7;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;">评分已确认提交，不可再次编辑。</div>' : '') +
    '<div style="color:#2563eb;background:#eff6ff;border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;">评分方式：百分制；提交后需二次确认，确认后不可编辑。</div>' +
    scoreInputHtml('创意性', 30, isSecond ? 28 : '', readonly) + scoreInputHtml('技术性', 30, isSecond ? 29 : '', readonly) + scoreInputHtml('艺术性', 25, isSecond ? 22 : '', readonly) + scoreInputHtml('实用性', 15, isSecond ? 13.5 : '', readonly) +
    '<div class="form-group"><label>评审意见</label><textarea id="score-comment" ' + (readonly ? 'disabled' : '') + '>' + (isSecond ? '作品结构完整，创意和落地性较好。' : '') + '</textarea></div>';
  footer.innerHTML = readonly ? '<button class="btn btn-secondary" onclick="closeModal()">关闭</button>' : '<button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="submitIndexScore()">提交评分</button>';
  modal.classList.add('show');
}

function scoreInputHtml(name, max, value, readonly) {
  return '<div style="display:flex;align-items:center;justify-content:space-between;border:1px solid #e5e7eb;border-radius:8px;padding:12px;margin-bottom:10px;"><div><div style="font-weight:600;">' + name + '</div><div style="font-size:12px;color:#9ca3af;">满分 ' + max + ' 分</div></div><input type="number" min="0" max="' + max + '" value="' + value + '" placeholder="0-' + max + '" style="width:120px;" ' + (readonly ? 'disabled' : '') + '></div>';
}

function submitIndexScore() {
  var body = document.getElementById('modal-body');
  var footer = document.getElementById('modal-footer');
  body.innerHTML = '<div style="color:#c2410c;background:#fff7ed;border:1px solid #fed7aa;border-radius:8px;padding:12px;margin-bottom:12px;font-size:13px;">评分提交后将不可再次编辑，请确认评分无误。</div>' +
    '<div class="form-group"><label>请输入汉字“确认”完成最终提交</label><input id="index-score-confirm-text" type="text" placeholder="请输入：确认"></div>';
  footer.innerHTML = '<button class="btn btn-secondary" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="confirmIndexScore()">确认提交</button>';
}

function confirmIndexScore() {
  var text = document.getElementById('index-score-confirm-text').value.trim();
  if (text !== '确认') {
    alert('请输入汉字“确认”后再提交');
    return;
  }
  window.indexScoreSubmitted = true;
  alert('评分已确认提交，后续不可编辑');
  closeModal();
  renderContent();
}

var dimensionNames = ['创意性', '技术性', '艺术性', '实用性', '完整性'];

function addScoringDimension() {
  var container = document.getElementById('scoring-dimensions');
  var dimensions = container.querySelectorAll('.dimension-row');
  var nextIndex = dimensions.length;
  var nextName = dimensionNames[nextIndex] || ('维度' + (nextIndex + 1));
  var nextWeight = Math.floor(100 / (nextIndex + 1));

  var dimensionHtml = '<div class="dimension-row">' +
    '<div class="form-row"><div class="form-group"><label>维度名称</label><input type="text" value="' + nextName + '"></div><div class="form-group"><label>权重(%)</label><input type="number" value="' + nextWeight + '"></div><div class="form-group"><label>操作</label><button class="btn btn-danger btn-sm" onclick="removeScoringDimension(this)">删除</button></div></div>' +
    '<div class="form-group"><label>维度说明</label><textarea placeholder="请输入该维度的评分标准说明"></textarea></div>' +
    '</div>';

  container.insertAdjacentHTML('beforeend', dimensionHtml);
}

function removeScoringDimension(btn) {
  var row = btn.closest('.dimension-row');
  if (row) {
    var container = document.getElementById('scoring-dimensions');
    var dimensions = container.querySelectorAll('.dimension-row');
    if (dimensions.length > 1) {
      row.remove();
    } else {
      alert('至少保留一个评分维度');
    }
  }
}

function addRound() {
  var configDiv = document.getElementById('rounds-config');
  var rounds = configDiv.querySelectorAll('.round-card');
  var nextRoundNum = rounds.length + 1;
  var nextRoundName = roundNames[nextRoundNum - 1] || ('第' + nextRoundNum + '轮');
  
  var roundHtml = '<div class="round-card" id="round-' + nextRoundNum + '">' +
    '<div class="round-card-header"><span class="round-num">第' + nextRoundNum + '轮</span><input type="text" class="round-name-input" value="' + nextRoundName + '" onblur="validateRoundName(this)"> <button class="btn btn-secondary btn-sm" onclick="removeRound(this)">删除</button></div>' +
    '<div class="form-row-3">' +
    '<div class="form-group"><label>评选开始时间</label><input type="datetime-local" placeholder="请选择开始时间"></div>' +
    '<div class="form-group"><label>评选结束时间</label><input type="datetime-local" placeholder="请选择结束时间"></div>' +
    '<div class="form-group"><label>晋级名额</label><input type="number" placeholder="如：10" value=""></div>' +
    '</div></div>';
  
  var addBtn = configDiv.querySelector('.add-round-btn');
  var tempDiv = document.createElement('div');
  tempDiv.innerHTML = roundHtml;
  configDiv.insertBefore(tempDiv.firstElementChild, addBtn);
}

function removeRound(btn) {
  var roundDiv = btn.closest('.round-card');
  if (roundDiv) {
    var configDiv = document.getElementById('rounds-config');
    var rounds = configDiv.querySelectorAll('.round-card');
    if (rounds.length > 1) {
      roundDiv.remove();
      renumberRounds();
    } else {
      alert('至少保留一个轮次');
    }
  }
}

function renumberRounds() {
  var configDiv = document.getElementById('rounds-config');
  var rounds = configDiv.querySelectorAll('.round-card');
  rounds.forEach(function(round, index) {
    var num = index + 1;
    round.querySelector('.round-num').textContent = '第' + num + '轮';
    round.id = 'round-' + num;
  });
}

function validateRoundName(input) {
  var value = input.value.trim();
  if (!value) {
    input.classList.add('error');
    alert('轮次名称不能为空');
    input.focus();
    return;
  }

  var configDiv = document.getElementById('rounds-config');
  var allInputs = configDiv.querySelectorAll('.round-name-input');
  var hasDuplicate = false;

  allInputs.forEach(function(otherInput) {
    if (otherInput !== input && otherInput.value.trim() === value) {
      hasDuplicate = true;
    }
  });

  if (hasDuplicate) {
    input.classList.add('error');
    alert('轮次名称不能重复');
    input.focus();
  } else {
    input.classList.remove('error');
  }
}
